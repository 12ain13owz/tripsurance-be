type: object
description: >-
  An optional extra a consumer can buy on top of a plan. code is the unique,
  stable identifier (FE i18n keys name and description by it) — id is only
  for internal reference. All money fields are integer **satang**
  (1 THB = 100); the admin UI edits baht and converts.
properties:
  id:
    type: string
    example: cmvv64vho0003g4fgl9cwdj1x
  code:
    type: string
    description: Lowercase kebab-case slug, max 50 chars. Set on create, never changes.
    example: baggage-plus
  pricingType:
    type: string
    enum: [PER_ORDER, PER_TRAVELLER, PER_TRAVELLER_PER_DAY]
    description: >-
      How price is charged on an order — PER_ORDER = price;
      PER_TRAVELLER = price × travellers; PER_TRAVELLER_PER_DAY = price ×
      travellers × trip days.
    example: PER_TRAVELLER
  price:
    type: integer
    description: >-
      Gross unit price in satang, stamp duty and VAT included. 9900 = ฿99.00.
    example: 9900
  coverageAmount:
    type: integer
    nullable: true
    description: Extra sum insured in satang, or null when the add-on has none. 1000000 = ฿10,000.
    example: 1000000
  isActive:
    type: boolean
    description: >-
      Whether consumers can see and buy it (through plans that offer it). New
      add-ons start inactive.
    example: true
  sortOrder:
    type: integer
    readOnly: true
    description: >-
      Display order, ascending. Set by the server — new add-ons go last;
      change it only with PATCH /admin/addons/reorder.
    example: 1
  createdAt:
    type: string
    format: date-time
    example: '2026-10-30T16:10:19.121Z'
  updatedAt:
    type: string
    format: date-time
    example: '2026-10-30T16:10:19.121Z'
