type: object
required:
  - currentPassword
  - newPassword
  - confirmPassword
properties:
  currentPassword:
    type: string
    example: CurrentPass1!
  newPassword:
    type: string
    minLength: 8
    description: >-
      Must contain at least one lowercase letter, one uppercase letter, one
      digit, and one special character. Must differ from currentPassword.
    example: NewStrong1!
  confirmPassword:
    type: string
    description: Must match newPassword.
    example: NewStrong1!
