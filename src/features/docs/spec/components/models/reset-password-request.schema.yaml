type: object
required:
  - token
  - newPassword
  - confirmPassword
properties:
  token:
    type: string
    description: Raw reset token from the emailed reset link (not the hash stored in the DB).
    example: 3f9c1e6b7a8d4f2e9c0b1a2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
  newPassword:
    type: string
    minLength: 8
    description: >-
      Must contain at least one lowercase letter, one uppercase letter, one
      digit, and one special character.
    example: NewStrong1!
  confirmPassword:
    type: string
    description: Must match newPassword.
    example: NewStrong1!
