openapi: 3.1.0
info:
  title: NodeJS Template API
  version: 1.0.0
  description: API documentation for the Node.js template project

servers:
  - url: http://localhost:3000

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Authentication
  - name: Country
    description: Countries available as travel-insurance coverage
  - name: Add-on
    description: Optional extras bought on top of a plan (admin catalogue)
  - name: Plan
    description: Insurance packages — price tiers, coverages, countries and add-ons

paths:
  /health:
    $ref: './paths/health/health.yaml'
  /health/error:
    $ref: './paths/health/error.yaml'
  /auth/sign-in:
    $ref: './paths/auth/sign-in.yaml'
  /auth/sign-out:
    $ref: './paths/auth/sign-out.yaml'
  /auth/refresh:
    $ref: './paths/auth/refresh.yaml'
  /auth/me:
    $ref: './paths/auth/me.yaml'
  /auth/change-password:
    $ref: './paths/auth/change-password.yaml'
  /auth/forgot-password:
    $ref: './paths/auth/forgot-password.yaml'
  /auth/reset-password:
    $ref: './paths/auth/reset-password.yaml'
  /auth/sessions:
    $ref: './paths/auth/sessions.yaml'
  /auth/sessions/{id}:
    $ref: './paths/auth/session-by-id.yaml'
  /countries:
    $ref: './paths/country/countries.yaml'
  /admin/countries:
    $ref: './paths/country/admin-countries.yaml'
  /admin/countries/{id}:
    $ref: './paths/country/country-by-id.yaml'
  /admin/addons:
    $ref: './paths/addon/admin-addons.yaml'
  /admin/addons/reorder:
    $ref: './paths/addon/addon-reorder.yaml'
  /admin/addons/{id}:
    $ref: './paths/addon/addon-by-id.yaml'
  /plans:
    $ref: './paths/plan/plans.yaml'
  /admin/plans:
    $ref: './paths/plan/admin-plans.yaml'
  /admin/plans/reorder:
    $ref: './paths/plan/plan-reorder.yaml'
  /admin/plans/{id}:
    $ref: './paths/plan/plan-by-id.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token returned by sign-in/refresh/reset-password, sent as an
        Authorization header in the form "Bearer <token>".
  schemas:
    HealthResponse:
      $ref: './components/models/health.schema.yaml'
    HealthErrorResponse:
      $ref: './components/models/error.schema.yaml'
    SignInRequest:
      $ref: './components/models/sign-in-request.schema.yaml'
    SignInResponse:
      $ref: './components/models/sign-in-response.schema.yaml'
    User:
      $ref: './components/models/user.schema.yaml'
    MessageResponse:
      $ref: './components/models/message-response.schema.yaml'
    MeResponse:
      $ref: './components/models/me-response.schema.yaml'
    ChangePasswordRequest:
      $ref: './components/models/change-password-request.schema.yaml'
    ForgotPasswordRequest:
      $ref: './components/models/forgot-password-request.schema.yaml'
    ResetPasswordRequest:
      $ref: './components/models/reset-password-request.schema.yaml'
    SessionSummary:
      $ref: './components/models/session-summary.schema.yaml'
    SessionListResponse:
      $ref: './components/models/session-list-response.schema.yaml'
    Country:
      $ref: './components/models/country.schema.yaml'
    CountryListResponse:
      $ref: './components/models/country-list-response.schema.yaml'
    CountryResponse:
      $ref: './components/models/country-response.schema.yaml'
    UpdateCountryRequest:
      $ref: './components/models/update-country-request.schema.yaml'
    Addon:
      $ref: './components/models/addon.schema.yaml'
    AddonListResponse:
      $ref: './components/models/addon-list-response.schema.yaml'
    AddonResponse:
      $ref: './components/models/addon-response.schema.yaml'
    CreateAddonRequest:
      $ref: './components/models/create-addon-request.schema.yaml'
    UpdateAddonRequest:
      $ref: './components/models/update-addon-request.schema.yaml'
    ReorderAddonsRequest:
      $ref: './components/models/reorder-addons-request.schema.yaml'
    Plan:
      $ref: './components/models/plan.schema.yaml'
    PlanPriceTier:
      $ref: './components/models/plan-price-tier.schema.yaml'
    PlanCoverage:
      $ref: './components/models/plan-coverage.schema.yaml'
    PlanListResponse:
      $ref: './components/models/plan-list-response.schema.yaml'
    PlanResponse:
      $ref: './components/models/plan-response.schema.yaml'
    CreatePlanRequest:
      $ref: './components/models/create-plan-request.schema.yaml'
    UpdatePlanRequest:
      $ref: './components/models/update-plan-request.schema.yaml'
    ReorderPlansRequest:
      $ref: './components/models/reorder-plans-request.schema.yaml'
    PublicPlan:
      $ref: './components/models/public-plan.schema.yaml'
    PublicPlanListResponse:
      $ref: './components/models/public-plan-list-response.schema.yaml'
  responses:
    SuccessResponse:
      $ref: './components/responses/success.response.yaml'
    ErrorResponse:
      $ref: './components/responses/error.response.yaml'
