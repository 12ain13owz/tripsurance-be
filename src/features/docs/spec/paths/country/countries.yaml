get:
  tags:
    - Country
  summary: List active countries
  operationId: listActiveCountries
  description: >-
    Public — no bearer token required. Consumer-facing (renders coverage
    options during the order flow). Returns only countries with isActive
    true, ordered by isoCode ascending. Admins list every country through
    GET /admin/countries.
  responses:
    '200':
      description: Listed country successfully
      content:
        application/json:
          schema:
            $ref: '../../components/models/country-list-response.schema.yaml'
