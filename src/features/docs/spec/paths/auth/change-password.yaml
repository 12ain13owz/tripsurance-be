post:
  tags:
    - Auth
  summary: Change password
  operationId: changePassword
  description: >-
    Rate limited. On success, every other active session for this user is
    revoked (the requesting device stays signed in) — see
    DELETE /auth/sessions for the same "revoke others" behavior exposed
    directly.
  security:
    - bearerAuth: []
  parameters:
    - in: cookie
      name: refreshToken
      required: false
      schema:
        type: string
      description: >-
        httpOnly refresh token cookie. Identifies which session to keep
        signed in when revoking the others; if absent, every session
        (including this request's) is revoked.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/models/change-password-request.schema.yaml'
  responses:
    '200':
      description: Password changed successfully
      content:
        application/json:
          schema:
            $ref: '../../components/models/message-response.schema.yaml'
    '401':
      description: >-
        Missing/invalid bearer token, currentPassword is wrong, or the
        account has been disabled.
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          examples:
            missingToken:
              summary: No Authorization header
              value:
                message: Authentication required
                timestamp: '2025-05-29T10:00:00Z'
            wrongCurrentPassword:
              summary: currentPassword does not match
              value:
                message: Current password is incorrect
                timestamp: '2025-05-29T10:00:00Z'
    '422':
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          examples:
            passwordsDoNotMatch:
              summary: confirmPassword does not match newPassword
              value:
                message: Passwords do not match
                timestamp: '2025-05-29T10:00:00Z'
            newPasswordSameAsCurrent:
              summary: newPassword is identical to currentPassword
              value:
                message: New password is the same as the current one
                timestamp: '2025-05-29T10:00:00Z'
