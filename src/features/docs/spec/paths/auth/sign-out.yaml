post:
  tags:
    - Auth
  summary: Sign out and revoke the current refresh token
  operationId: signOut
  parameters:
    - in: cookie
      name: refreshToken
      required: false
      schema:
        type: string
      description: >-
        httpOnly refresh token cookie. Revoked if present. Idempotent —
        still returns 200 if the cookie is missing or already revoked.
  responses:
    '200':
      description: Signed out successfully
      headers:
        Set-Cookie:
          description: Clears the `refreshToken` cookie (Max-Age=0).
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../../components/models/message-response.schema.yaml'
