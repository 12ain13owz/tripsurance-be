post:
  tags:
    - Auth
  summary: Forgot password
  operationId: forgotPassword
  description: >-
    Requests a password reset link by email. Rate limited. Always responds
    200 with the same message whether or not
    the email matches an account, to avoid leaking which emails are
    registered (anti-enumeration).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/models/forgot-password-request.schema.yaml'
  responses:
    '200':
      description: Password reset link sent successfully
      content:
        application/json:
          schema:
            $ref: '../../components/models/message-response.schema.yaml'
    '422':
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          example:
            message: Invalid email format
            timestamp: '2025-05-29T10:00:00Z'
