post:
  tags:
    - Auth
  summary: Reset password
  operationId: resetPassword
  description: >-
    Resets a forgotten password using an emailed token. Rate limited.
    Requires no Authorization header — identity is proven by
    the raw reset token alone. On success, every existing session for the
    user is revoked and a fresh session is issued immediately (the caller
    is signed in on this device without a separate sign-in call).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/models/reset-password-request.schema.yaml'
  responses:
    '200':
      description: Password reset successfully
      headers:
        Set-Cookie:
          description: httpOnly `refreshToken` cookie for the freshly issued session.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../../components/models/sign-in-response.schema.yaml'
    '401':
      description: The reset token is invalid, already used, or has expired.
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          examples:
            invalidOrUsedToken:
              summary: Token does not match any reset request, or was already used
              value:
                message: Invalid or expired token
                timestamp: '2025-05-29T10:00:00Z'
            expiredToken:
              summary: Token existed but its expiry has passed
              value:
                message: Password reset token has expired
                timestamp: '2025-05-29T10:00:00Z'
    '422':
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          example:
            message: Passwords do not match
            timestamp: '2025-05-29T10:00:00Z'
