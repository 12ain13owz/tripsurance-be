get:
  tags:
    - Add-on
  summary: List all add-ons
  operationId: listAddons
  description: >-
    Admin only. Returns every add-on regardless of isActive, ordered by
    sortOrder then code. There is no public add-on route — consumers see a
    plan's active add-ons embedded in GET /plans.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Listed addon successfully
      content:
        application/json:
          schema:
            $ref: '../../components/models/addon-list-response.schema.yaml'
    '401':
      description: No Authorization header, or the bearer token is invalid/expired.
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          example:
            message: Authentication required
            timestamp: '2025-05-29T10:00:00Z'
post:
  tags:
    - Add-on
  summary: Create add-on
  operationId: createAddon
  description: >-
    Admin only. The new add-on starts inactive and is placed last (current
    max sortOrder + 1, or 0 for the first). Money fields are satang.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/models/create-addon-request.schema.yaml'
  responses:
    '201':
      description: Created addon successfully
      content:
        application/json:
          schema:
            $ref: '../../components/models/addon-response.schema.yaml'
    '401':
      description: No Authorization header, or the bearer token is invalid/expired.
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          example:
            message: Authentication required
            timestamp: '2025-05-29T10:00:00Z'
    '409':
      description: Another add-on already uses this code.
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          example:
            message: Add-on code already exists
            timestamp: '2025-05-29T10:00:00Z'
    '422':
      description: >-
        Body failed validation — e.g. code not kebab-case, unknown
        pricingType, or a price that isn't a positive integer (baht sent
        instead of satang).
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
          example:
            message: Invalid code format
            timestamp: '2025-05-29T10:00:00Z'
