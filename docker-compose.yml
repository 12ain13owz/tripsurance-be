services:
  nodejs:
    build:
      context: .
      dockerfile: Dockerfile
    image: tripsurance-be-img
    container_name: tripsurance-be-app
    restart: on-failure:3
    env_file:
      - .env.prod
    ports:
      - '3000:3000'

  # Optional — forward Stripe webhooks to the backend running on the host (npm run dev :3000).
  # Usage: docker compose --env-file .env.dev --profile stripe up stripe-cli
  # (--env-file is required so ${STRIPE_SECRET_KEY} below resolves from .env.dev — Compose only
  # auto-loads a file literally named ".env" for variable substitution, not .env.dev)
  # Copy the whsec_... printed in the container logs into STRIPE_WEBHOOK_SECRET (.env.dev), then restart the backend.
  stripe-cli:
    profiles: [stripe]
    image: stripe/stripe-cli:latest
    container_name: tripsurance-stripe-cli
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    command: listen --forward-to host.docker.internal:3000/payments/webhook
    extra_hosts:
      - host.docker.internal:host-gateway
