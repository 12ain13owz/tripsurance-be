services:
  nodejs:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
    image: tripsurance-be-img
    container_name: tripsurance-be-app
    restart: on-failure:3
    env_file:
      - .env.prod
    ports:
      - '3000:3000'

  postgres:
    image: postgres:18
    container_name: tripsurance-postgres
    environment:
      POSTGRES_USER: user_postgres
      POSTGRES_PASSWORD: pass_postgres
      POSTGRES_DB: tripsurance
    ports:
      - '5432:5432'
    volumes:
      - db-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user_postgres']
      interval: 2s
      retries: 15

  stripe-cli:
    profiles: [stripe]
    image: stripe/stripe-cli:latest
    container_name: tripsurance-stripe-cli
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    command: listen --forward-to host.docker.internal:3000/payments/webhook
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  db-postgres-data:
